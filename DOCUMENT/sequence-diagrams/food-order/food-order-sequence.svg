<svg xmlns="http://www.w3.org/2000/svg" width="1690" height="1804" viewBox="0 0 1690 1804"><rect width="1690" height="1804" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#17212b}.msg{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style><rect x="5" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="130" y="62" text-anchor="middle">Customer App</text><path d="M130 85 V1779" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="355" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="480" y="62" text-anchor="middle">FoodOrder API / Service</text><path d="M480 85 V1779" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="705" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="830" y="62" text-anchor="middle">Repositories / Database</text><path d="M830 85 V1779" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1055" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="1180" y="62" text-anchor="middle">Merchant Portal</text><path d="M1180 85 V1779" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1405" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="1530" y="62" text-anchor="middle">Kafka Broker</text><path d="M1530 85 V1779" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="15" y="115" width="1660" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="140">Create order [CASH; valid request]</text><path d="M130 204 H480" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="305" y="191" text-anchor="middle">POST /api/v1/food-orders</text><path d="M480 268 H830" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="655" y="255" text-anchor="middle">Load restaurant and menu items</text><path d="M830 332 H480" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="655" y="319" text-anchor="middle">Restaurant and menu data</text><path d="M480 386 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="555" y="399">Check OPEN, unlocked, items available</text><path d="M480 450 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="555" y="463">Calculate item totals and delivery fee</text><path d="M480 524 H830" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="655" y="511" text-anchor="middle">Save FoodOrder (PENDING) + FoodOrderItem</text><path d="M480 588 H130" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="305" y="575" text-anchor="middle">201 Created: ApiResponse&lt;FoodOrderResponse&gt;</text><rect x="15" y="627" width="1660" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="652">loop [Auto-refresh enabled: every 5 s]</text><path d="M1180 716 H480" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="830" y="703" text-anchor="middle">GET /api/v1/food-orders/restaurant/{restaurantId}</text><path d="M480 780 H830" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="655" y="767" text-anchor="middle">Check owner; load restaurant orders</text><path d="M480 844 H1180" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="830" y="831" text-anchor="middle">200 OK: orders excluding AWAITING_PAYMENT</text><rect x="15" y="883" width="1660" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="908">Restaurant accepts and prepares the order</text><path d="M1180 972 H480" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="830" y="959" text-anchor="middle">PATCH /api/v1/food-orders/{orderId}/status: ACCEPTED</text><path d="M480 1026 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="555" y="1039">Redis lock; check owner and current status</text><path d="M480 1100 H830" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="655" y="1087" text-anchor="middle">Save PENDING → ACCEPTED</text><path d="M480 1164 H1180" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="830" y="1151" text-anchor="middle">200 OK: updated order; release lock</text><path d="M1180 1228 H480" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="830" y="1215" text-anchor="middle">PATCH /api/v1/food-orders/{orderId}/status: PREPARING</text><path d="M480 1282 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="555" y="1295">Redis lock; check owner and current status</text><path d="M480 1356 H830" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="655" y="1343" text-anchor="middle">Save ACCEPTED → PREPARING</text><path d="M480 1420 H1180" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="830" y="1407" text-anchor="middle">200 OK: updated order; release lock</text><rect x="15" y="1459" width="1660" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1484">opt [Restaurant marks the order ready for pickup]</text><path d="M1180 1548 H480" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="830" y="1535" text-anchor="middle">PATCH /api/v1/food-orders/{orderId}/status: READY_FOR_PICKUP</text><path d="M480 1612 H830" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="655" y="1599" text-anchor="middle">Validate and save READY_FOR_PICKUP</text><path d="M480 1676 H1530" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="1005" y="1663" text-anchor="middle">Publish FIND_DRIVER_FOR_FOOD_ORDER</text><path d="M480 1740 H1180" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="830" y="1727" text-anchor="middle">200 OK: updated order</text><rect x="15" y="627" width="1660" height="239" fill="none" stroke="#64748b"/><rect x="15" y="1459" width="1660" height="303" fill="none" stroke="#64748b"/></svg>