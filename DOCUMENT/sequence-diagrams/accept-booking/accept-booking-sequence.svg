<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="2010" viewBox="0 0 1840 2010"><rect width="1840" height="2010" fill="white"/><defs><marker id="arr" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b;font-size:18px}.msg{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style><path d="M110 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="5" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="110" y="62" text-anchor="middle">Customer App</text><path d="M340 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="235" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="340" y="62" text-anchor="middle">Booking API / Service</text><path d="M570 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="465" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="570" y="62" text-anchor="middle">Location Service</text><path d="M800 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="695" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="800" y="62" text-anchor="middle">Pricing Service</text><path d="M1030 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="925" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="1030" y="62" text-anchor="middle">BookingRepository</text><path d="M1260 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1155" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="1260" y="62" text-anchor="middle">Redis</text><path d="M1490 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1385" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="1490" y="62" text-anchor="middle">User-Driver Service</text><path d="M1720 85 V1980" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1615" y="25" width="210" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="1720" y="62" text-anchor="middle">Driver App</text><rect x="15" y="115" width="1810" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="140" font-weight="bold">1. Create booking and invite a driver</text><path d="M110 202 H340" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="225" y="189" text-anchor="middle">POST /api/v1/bookings</text><path d="M340 254 h70 v25 h-70" fill="none" stroke="#334155" marker-end="url(#arr)"/><text class="msg" x="430" y="267">Check request rate and active booking</text><path d="M340 326 H570" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="455" y="313" text-anchor="middle">Find nearby drivers (configured radius)</text><path d="M570 388 H340" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="455" y="375" text-anchor="middle">Nearby drivers</text><path d="M340 450 H800" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="570" y="437" text-anchor="middle">Calculate fare (route + nearby supply)</text><path d="M800 512 H340" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="570" y="499" text-anchor="middle">Price and distance</text><path d="M340 574 H1030" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="685" y="561" text-anchor="middle">Save Booking: PENDING</text><path d="M340 636 H1490" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="915" y="623" text-anchor="middle">Check candidate is ONLINE</text><path d="M1490 698 H340" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="915" y="685" text-anchor="middle">Online status</text><path d="M340 760 H1260" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="800" y="747" text-anchor="middle">Reserve driver: SET NX, TTL = 30 s</text><path d="M1260 822 H340" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="800" y="809" text-anchor="middle">Reservation acquired</text><path d="M340 884 H1720" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="1030" y="871" text-anchor="middle">WebSocket: /queue/driver/match</text><path d="M340 936 h70 v25 h-70" fill="none" stroke="#334155" marker-end="url(#arr)"/><text class="msg" x="430" y="949">Start asynchronous 20 s timeout</text><path d="M340 1008 H110" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="225" y="995" text-anchor="middle">200 OK: BookingResponse (PENDING)</text><rect x="15" y="1045" width="1810" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1070" font-weight="bold">2. Driver accepts the invitation</text><path d="M1720 1132 H340" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="1030" y="1119" text-anchor="middle">PUT /api/v1/bookings/{bookingId}/accept</text><path d="M340 1194 H1260" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="800" y="1181" text-anchor="middle">Read driver reservation</text><path d="M1260 1256 H340" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="800" y="1243" text-anchor="middle">Reserved bookingId</text><path d="M340 1318 H1030" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="685" y="1305" text-anchor="middle">Load booking and check PENDING</text><rect x="15" y="1355" width="1810" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1380" font-weight="bold">alt [Reservation matches and booking is PENDING]</text><path d="M340 1442 H1030" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="685" y="1429" text-anchor="middle">Save ACCEPTED, driverId, acceptedAt</text><path d="M340 1504 H1260" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="800" y="1491" text-anchor="middle">Delete driver reservation</text><path d="M340 1566 H1490" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="915" y="1553" text-anchor="middle">Update driver status: BUSY</text><path d="M340 1628 H110" fill="none" stroke="#334155"  marker-end="url(#arr)"/><text class="msg" x="225" y="1615" text-anchor="middle">WebSocket: /queue/booking/status (ACCEPTED)</text><path d="M340 1690 H1720" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="1030" y="1677" text-anchor="middle">200 OK: BookingResponse</text><rect x="15" y="1727" width="1810" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1752" font-weight="bold">else [Reservation invalid or booking is not PENDING]</text><path d="M340 1814 H1720" fill="none" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#arr)"/><text class="msg" x="1030" y="1801" text-anchor="middle">400 Bad Request</text><rect x="15" y="1851" width="1810" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1876" font-weight="bold">Timeout: still PENDING after 20 s → release driver and try another</text><path d="M340 1928 h70 v25 h-70" fill="none" stroke="#334155" marker-end="url(#arr)"/><text class="msg" x="430" y="1941">BookingTimeoutService → BookingReassignService</text><rect x="15" y="1355" width="1810" height="496" fill="none" stroke="#64748b" stroke-width="1.5"/></svg>