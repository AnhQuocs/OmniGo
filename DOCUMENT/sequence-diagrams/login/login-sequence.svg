<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1500" viewBox="0 0 1600 1500"><rect width="1600" height="1500" fill="white"/><defs><marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#17212b}.msg{font-size:17px;paint-order:stroke;stroke:white;stroke-width:5px;stroke-linejoin:round}.line{fill:none;stroke:#334155;stroke-width:1.5}</style><path d="M110 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="10" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="110" y="55" text-anchor="middle">Client</text><text class="msg" x="110" y="78" text-anchor="middle">(App / Web)</text><path d="M340 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="240" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="340" y="67" text-anchor="middle">API Gateway</text><path d="M570 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="470" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="570" y="67" text-anchor="middle">AuthController</text><path d="M800 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="700" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="800" y="67" text-anchor="middle">AuthService</text><path d="M1030 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="930" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="1030" y="67" text-anchor="middle">Spring Security</text><path d="M1260 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1160" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="1260" y="67" text-anchor="middle">UserRepository</text><path d="M1490 95 V1460" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1390" y="25" width="200" height="70" rx="3" fill="#edf2f7" stroke="#475569"/><text class="msg" x="1490" y="67" text-anchor="middle">Redis</text><path class="line"  marker-end="url(#arrow)" d="M110 155 H340"/><text class="msg" x="225" y="122" text-anchor="middle">POST /api/v1/auth/login</text><text class="msg" x="225" y="143" text-anchor="middle">phoneNumber, password</text><path class="line"  marker-end="url(#arrow)" d="M340 205 H570"/><text class="msg" x="455" y="193" text-anchor="middle">Forward request</text><path class="line"  marker-end="url(#arrow)" d="M570 255 H800"/><text class="msg" x="685" y="243" text-anchor="middle">login(request)</text><path class="line"  marker-end="url(#arrow)" d="M800 305 H1260"/><text class="msg" x="1030" y="293" text-anchor="middle">findByPhoneNumber(phoneNumber)</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M1260 350 H800"/><text class="msg" x="1030" y="338" text-anchor="middle">User / empty</text><rect x="15" y="380" width="1570" height="165" fill="none" stroke="#64748b"/><path d="M15 410 H80 L95 395 V380" fill="#edf2f7" stroke="#64748b"/><text class="msg" x="48" y="401" text-anchor="middle">break</text><text class="msg" x="115" y="402" text-anchor="start">[Account is locked]</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M800 435 H570"/><text class="msg" x="685" y="423" text-anchor="middle">InvalidCredentialsException</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M570 480 H340"/><text class="msg" x="455" y="468" text-anchor="middle">401 Unauthorized</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M340 525 H110"/><text class="msg" x="225" y="513" text-anchor="middle">Show login error</text><path class="line"  marker-end="url(#arrow)" d="M800 600 H1030"/><text class="msg" x="915" y="588" text-anchor="middle">authenticate(...)</text><path class="line"  marker-end="url(#arrow)" d="M1030 660 H1260"/><text class="msg" x="1145" y="627" text-anchor="middle">loadUserByUsername()</text><text class="msg" x="1145" y="648" text-anchor="middle">via CustomUserDetailsService</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M1260 705 H1030"/><text class="msg" x="1145" y="693" text-anchor="middle">User / not found</text><rect x="900" y="725" width="360" height="58" fill="#f8fafc" stroke="#94a3b8"/><text class="msg" x="1080" y="748" text-anchor="middle">Check account status and password</text><text class="msg" x="1080" y="772" text-anchor="middle">UserPrincipal + BCryptPasswordEncoder</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M1030 820 H800"/><text class="msg" x="915" y="808" text-anchor="middle">Authentication / exception</text><rect x="15" y="855" width="1570" height="590" fill="none" stroke="#64748b"/><path d="M15 885 H80 L95 870 V855" fill="#edf2f7" stroke="#64748b"/><text class="msg" x="48" y="876" text-anchor="middle">alt</text><text class="msg" x="115" y="877" text-anchor="start">[Authentication succeeds]</text><path class="line" marker-end="url(#arrow)" d="M800 905 h85 v35 h-85"/><text class="msg" x="900" y="908" text-anchor="start">Generate access token</text><text class="msg" x="900" y="929" text-anchor="start">via JwtTokenProvider</text><path class="line"  marker-end="url(#arrow)" d="M800 1000 H1490"/><text class="msg" x="1145" y="967" text-anchor="middle">Generate and save refresh token with TTL</text><text class="msg" x="1145" y="988" text-anchor="middle">via RefreshTokenService</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M1490 1045 H800"/><text class="msg" x="1145" y="1033" text-anchor="middle">Saved</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M800 1090 H570"/><text class="msg" x="685" y="1078" text-anchor="middle">LoginResponse: tokens + user</text><path class="line" marker-end="url(#arrow)" d="M570 1120 h85 v35 h-85"/><text class="msg" x="670" y="1123" text-anchor="start">Set-Cookie: refresh_token; HttpOnly</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M570 1180 H340"/><text class="msg" x="455" y="1168" text-anchor="middle">200 OK + body + Set-Cookie</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M340 1225 H110"/><text class="msg" x="225" y="1213" text-anchor="middle">Forward response; open main screen</text><path d="M15 1250 H1585" stroke="#64748b" stroke-dasharray="6 4"/><text class="msg" x="800" y="1273" text-anchor="middle">[Invalid credentials / disabled account]</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M800 1310 H570"/><text class="msg" x="685" y="1298" text-anchor="middle">InvalidCredentialsException</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M570 1365 H340"/><text class="msg" x="455" y="1353" text-anchor="middle">401 Unauthorized</text><path class="line" stroke-dasharray="6 4" marker-end="url(#arrow)" d="M340 1420 H110"/><text class="msg" x="225" y="1408" text-anchor="middle">Show login error</text></svg>