<svg xmlns="http://www.w3.org/2000/svg" width="1550" height="820" viewBox="0 0 1550 820"><rect width="1550" height="820" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:19px;fill:#17212b}.msg{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style><rect x="35" y="25" width="250" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="160" y="62" text-anchor="middle">Driver App</text><path d="M160 85 V775" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="445" y="25" width="250" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="570" y="62" text-anchor="middle">LocationController</text><path d="M570 85 V775" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="855" y="25" width="250" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="980" y="62" text-anchor="middle">LocationService</text><path d="M980 85 V775" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1265" y="25" width="250" height="60" rx="3" fill="#edf2f7" stroke="#475569"/><text x="1390" y="62" text-anchor="middle">Redis Geo</text><path d="M1390 85 V775" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="20" y="115" width="1510" height="630" fill="none" stroke="#64748b"/><path d="M20 150 H80 L95 135 V115" fill="#edf2f7" stroke="#64748b"/><text x="35" y="140">loop</text><text x="120" y="140">[New location callback while tracking is active]</text><path d="M160 205 h80 v35 h-80" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="260" y="225">Read device location</text><rect x="35" y="265" width="430" height="65" fill="#f8fafc" stroke="#94a3b8"/><text x="50" y="290">Requested interval: 5 s</text><text x="50" y="317">Minimum interval: 3 s; distance: 5 m</text><path d="M160 400 H570" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="365" y="364" text-anchor="middle">POST /api/v1/locations/drivers/me</text><text class="msg" x="365" y="388" text-anchor="middle">latitude, longitude</text><path d="M570 465 H980" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="775" y="453" text-anchor="middle">updateDriverLocation(driverId, request)</text><path d="M980 545 H1390" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="1185" y="509" text-anchor="middle">GEOADD drivers:online:locations</text><text class="msg" x="1185" y="533" text-anchor="middle">longitude, latitude, driverId</text><path d="M1390 600 H980" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="1185" y="588" text-anchor="middle">Updated</text><path d="M980 655 H570" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="775" y="643" text-anchor="middle">Return</text><path d="M570 710 H160" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="365" y="698" text-anchor="middle">200 OK + text response</text></svg>