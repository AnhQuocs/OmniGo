"#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="750" y="1302" text-anchor="middle">ApiResponse&lt;UserResponse&gt;</text><path d="M550 1380 H150" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="350" y="1367" text-anchor="middle">200 OK: updated profile</text><path d="M150 1435 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="225" y="1448">Show result and refresh driver list</text></svg>