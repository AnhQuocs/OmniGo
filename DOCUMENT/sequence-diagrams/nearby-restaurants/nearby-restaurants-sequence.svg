<svg xmlns="http://www.w3.org/2000/svg" width="1560" height="1250" viewBox="0 0 1560 1250"><rect width="1560" height="1250" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#17212b}.msg{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style><rect x="5" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569" rx="3"/><text x="130" y="62" text-anchor="middle">Customer App</text><path d="M130 85 V1210" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="325" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569" rx="3"/><text x="450" y="62" text-anchor="middle">RestaurantController</text><path d="M450 85 V1210" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="645" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569" rx="3"/><text x="770" y="62" text-anchor="middle">RestaurantService</text><path d="M770 85 V1210" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="965" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569" rx="3"/><text x="1090" y="62" text-anchor="middle">RestaurantRepository</text><path d="M1090 85 V1210" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1285" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569" rx="3"/><text x="1410" y="62" text-anchor="middle">PostgreSQL</text><path d="M1410 85 V1210" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="15" y="115" width="1530" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="140">loop [Search or request another page]</text><path d="M130 205 H450" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="290" y="170" text-anchor="middle">GET /api/v1/restaurants/nearby</text><text class="msg" x="290" y="193" text-anchor="middle">latitude, longitude, radiusKm, page, limit</text><path d="M450 270 H770" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="610" y="258" text-anchor="middle">getNearbyRestaurants(...)</text><path d="M770 325 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="845" y="338">Validate coordinates, radius and pagination</text><rect x="15" y="375" width="1530" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="400">alt [Valid parameters]</text><path d="M770 465 H1090" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="930" y="453" text-anchor="middle">findNearbyRestaurants(..., Pageable)</text><path d="M1090 530 H1410" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="1250" y="495" text-anchor="middle">Haversine filter + page query</text><text class="msg" x="1250" y="518" text-anchor="middle">OPEN, unlocked, within radiusKm</text><path d="M1410 595 H1090" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="1250" y="583" text-anchor="middle">Page rows + totalElements</text><path d="M1090 660 H770" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="930" y="648" text-anchor="middle">Page&lt;RestaurantNearbyProjection&gt;</text><path d="M770 715 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="845" y="728">Map to RestaurantNearbyResponse</text><path d="M770 790 H450" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="610" y="778" text-anchor="middle">Page&lt;RestaurantNearbyResponse&gt;</text><path d="M450 855 H130" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="290" y="843" text-anchor="middle">200 OK: ApiResponse&lt;Page&lt;...&gt;&gt;</text><path d="M130 910 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="205" y="923">Display restaurants and pagination</text><rect x="15" y="960" width="1530" height="38" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="985">else [Invalid parameters]</text><path d="M770 1050 H450" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="610" y="1038" text-anchor="middle">BadRequestException</text><path d="M450 1115 H130" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="290" y="1103" text-anchor="middle">400 Bad Request</text><rect x="15" y="115" width="1530" height="1070" fill="none" stroke="#64748b"/><rect x="22" y="375" width="1516" height="795" fill="none" stroke="#64748b"/></svg>