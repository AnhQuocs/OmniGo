<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1710" viewBox="0 0 1660 1710"><rect width="1660" height="1710" fill="white"/><defs><marker id="a" markerWidth="9" markerHeight="8" refX="8" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#334155"/></marker></defs><style>text{font-family:Arial,sans-serif;font-size:18px;fill:#17212b}.msg{paint-order:stroke;stroke:white;stroke-width:6px;stroke-linejoin:round}</style><rect x="5" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="130" y="62" text-anchor="middle">App / Browser</text><path d="M130 85 V1685" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="350" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="475" y="62" text-anchor="middle">Payment API / MoMo</text><path d="M475 85 V1685" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="695" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="820" y="62" text-anchor="middle">MoMo Gateway</text><path d="M820 85 V1685" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1040" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="1165" y="62" text-anchor="middle">WalletService</text><path d="M1165 85 V1685" stroke="#94a3b8" stroke-dasharray="6 5"/><rect x="1385" y="25" width="250" height="60" fill="#edf2f7" stroke="#475569"/><text x="1510" y="62" text-anchor="middle">Repositories / DB</text><path d="M1510 85 V1685" stroke="#94a3b8" stroke-dasharray="6 5"/><path d="M130 155 H475" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="302.5" y="120" text-anchor="middle">POST /api/v1/payments/payment/create</text><text class="msg" x="302.5" y="143" text-anchor="middle">method, type, amount</text><path d="M475 215 H1165" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="820" y="203" text-anchor="middle">getOrCreateWallet(userId, userType)</text><path d="M1165 275 H475" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="820" y="263" text-anchor="middle">Wallet</text><path d="M475 335 H1510" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="992.5" y="323" text-anchor="middle">Save Transaction: DEPOSIT / PENDING</text><path d="M475 385 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="550" y="398">Sign create request (HMAC-SHA256)</text><path d="M475 455 H820" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="647.5" y="443" text-anchor="middle">Call MoMo create-payment API</text><path d="M820 515 H475" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="647.5" y="503" text-anchor="middle">payUrl</text><path d="M475 575 H130" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="302.5" y="563" text-anchor="middle">200 OK: orderId + paymentUrl</text><path d="M130 635 H820" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="475" y="623" text-anchor="middle">Open payment URL; user pays</text><path d="M820 695 H475" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="647.5" y="683" text-anchor="middle">POST /api/v1/payments/momo/ipn</text><path d="M475 745 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="550" y="758">verifyIpnSignature(request)</text><rect x="15" y="790" width="1630" height="36" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="815">break [Invalid signature]</text><path d="M475 865 h55 v30 h-55" fill="none" stroke="#334155" marker-end="url(#a)"/><text class="msg" x="550" y="878">Reject callback; no wallet credit</text><rect x="15" y="790" width="1630" height="130" fill="none" stroke="#64748b"/><path d="M475 995 H1510" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="992.5" y="983" text-anchor="middle">Find transaction by orderId</text><rect x="15" y="1030" width="1630" height="36" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1055">break [Transaction already SUCCESS]</text><path d="M475 1115 H820" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="647.5" y="1103" text-anchor="middle">204 No Content; no additional credit</text><rect x="15" y="1030" width="1630" height="130" fill="none" stroke="#64748b"/><rect x="15" y="1210" width="1630" height="36" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1235">alt [resultCode = 0]</text><path d="M475 1295 H1510" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="992.5" y="1283" text-anchor="middle">Save SUCCESS + gatewayTransId</text><path d="M475 1355 H1165" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="820" y="1343" text-anchor="middle">creditWallet(userId, userType, amount)</text><path d="M1165 1415 H1510" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="1337.5" y="1403" text-anchor="middle">Lock wallet; add amount; save balance</text><rect x="15" y="1450" width="1630" height="36" fill="#edf2f7" stroke="#94a3b8"/><text x="35" y="1475">else [Other resultCode]</text><path d="M475 1535 H1510" stroke="#334155"  marker-end="url(#a)"/><text class="msg" x="992.5" y="1523" text-anchor="middle">Save Transaction: FAILED</text><rect x="15" y="1210" width="1630" height="370" fill="none" stroke="#64748b"/><path d="M475 1655 H820" stroke="#334155" stroke-dasharray="6 4" marker-end="url(#a)"/><text class="msg" x="647.5" y="1643" text-anchor="middle">204 No Content</text></svg>