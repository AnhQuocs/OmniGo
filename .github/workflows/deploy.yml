name: CI/CD Pipeline

on:
 push:
   branches:
     - main

jobs:
 build-and-push:
   runs-on: ubuntu-latest
   steps:
     - name: Checkout Code
       uses: actions/checkout@v3

     - name: Setup Java JDK 17
       uses: actions/setup-java@v3
       with:
         java-version: '17'
         distribution: 'temurin'
         cache: 'gradle'

     - name: Cấp quyền thực thi cho TẤT CẢ gradlew
       run: find ./SRC/BE -name "gradlew" -exec chmod +x {} \;

     - name: Build file .jar từng service con
       run: |
        (cd SRC/BE/discovery-service && ./gradlew clean bootJar -x test --no-daemon)
        (cd SRC/BE/api-gateway && ./gradlew clean bootJar -x test --no-daemon)
        (cd SRC/BE/user-driver-service && ./gradlew clean bootJar -x test --no-daemon)
        (cd SRC/BE/payment-service && ./gradlew clean bootJar -x test --no-daemon)
        (cd SRC/BE/booking-service && ./gradlew clean bootJar -x test --no-daemon)
        (cd SRC/BE/pricing-service && ./gradlew clean bootJar -x test --no-daemon)
        (cd SRC/BE/location-service && ./gradlew clean bootJar -x test --no-daemon)

     - name: Login to Docker Hub
       uses: docker/login-action@v2
       with:
         username: ${{ secrets.DOCKER_USERNAME }}
         password: ${{ secrets.DOCKER_PASSWORD }}

     - name: Build và Push Docker Images lên Docker Hub
       run: |
         # 1. Discovery Service
         docker build -t vmt1609/discovery-service:latest ./SRC/BE/discovery-service
         docker push vmt1609/discovery-service:latest

         # 2. API Gateway
         docker build -t vmt1609/api-gateway:latest ./SRC/BE/api-gateway
         docker push vmt1609/api-gateway:latest

         # 3. User Driver Service
         docker build -t vmt1609/user-driver-service:latest ./SRC/BE/user-driver-service
         docker push vmt1609/user-driver-service:latest

         # 4. Payment Service
         docker build -t vmt1609/payment-service:latest ./SRC/BE/payment-service
         docker push vmt1609/payment-service:latest

         # 5. Booking Service
         docker build -t vmt1609/booking-service:latest ./SRC/BE/booking-service
         docker push vmt1609/booking-service:latest

         # 6. Pricing Service
         docker build -t vmt1609/pricing-service:latest ./SRC/BE/pricing-service
         docker push vmt1609/pricing-service:latest

         # 7. Location Service
         docker build -t vmt1609/location-service:latest ./SRC/BE/location-service
         docker push vmt1609/location-service:latest

 deploy-to-vps:
   needs: build-and-push
   runs-on: ubuntu-latest
   steps:
     - name: Deploy to VPS via SSH
       uses: appleboy/ssh-action@v1.0.3
       with:
         host: ${{ secrets.VPS_HOST }}
         username: ${{ secrets.VPS_USERNAME }}
         password: ${{ secrets.VPS_PASSWORD }}
         port: 22
         script: |
           cd /home/trung/RIDE-HAILING-LOGISTICS-SYSTEM

           git pull origin main

           docker compose pull

           docker compose up -d

           docker compose restart frontend

           docker image prune -f