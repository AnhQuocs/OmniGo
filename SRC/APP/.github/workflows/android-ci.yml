name: OmniGo Android CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'SRC/APP/**'                             # Chỉ chạy CI nếu có file đổi trong thư mục APP
      - '.github/workflows/android-ci.yml'       # Hoặc khi sửa chính cái file CI này
  pull_request:
    branches: [ "main" ]
    paths:
      - 'SRC/APP/**'
      - '.github/workflows/android-ci.yml'

jobs:
  build_and_test:
    name: Build & Run Unit Tests
    runs-on: ubuntu-latest
    
    # BẮT BUỘC: Bảo GitHub chạy các lệnh gradlew ở trong thư mục SRC/APP
    defaults:
      run:
        working-directory: ./SRC/APP

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x ./gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace
        
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: OmniGo-Debug-APK
          path: SRC/APP/app/build/outputs/apk/debug/app-debug.apk