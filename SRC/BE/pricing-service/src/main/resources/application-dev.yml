server:
  port: 8084

spring:
  data:
    redis:
      host: localhost
      port: 6379
      database: 3
  datasource:
    url: jdbc:postgresql://localhost:5432/pricing_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.trung: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

    org.springframework: INFO
    org.apache.kafka: INFO

osrm:
  url: ${OSRM_URL:http://localhost:5000}
  car-url: ${OSRM_CAR_URL:http://localhost:5000}
  bike-url: ${OSRM_BIKE_URL:http://localhost:5001}
  public-url: ${OSRM_PUBLIC_URL:https://router.project-osrm.org}
  connect-timeout-ms: 2000
  read-timeout-ms: 2500


