server:
  port: 8086

spring:
  datasource:
    url: jdbc:postgresql://localhost:5432/food_delivery_db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379

  kafka:
    bootstrap-servers: localhost:9092
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: find-driver-for-food:com.trung.fooddeliveryservice.event.FindDriverForFoodOrderEvent,driver-assigned-food:com.trung.fooddeliveryservice.event.DriverAssignedToFoodOrderEvent
    consumer:
      group-id: food-delivery-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: driver-assigned-food:com.trung.fooddeliveryservice.event.DriverAssignedToFoodOrderEvent,com.trung.bookingservice.event.DriverAssignedToFoodOrderEvent:com.trung.fooddeliveryservice.event.DriverAssignedToFoodOrderEvent


eureka:
  client:
    fetch-registry: true
    register-with-eureka: true
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

jwt:
  secret: DayLaChuoiBiMatMacDinhCuaToiChoMoiTruongDev123456


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.trung: DEBUG

    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE

    org.springframework: INFO
    org.apache.kafka: INFO

app:
  payment-service-url: http://localhost:8085
  driver-service-url: http://localhost:8081