server:
  port: ${FOOD_DELIVERY_SERVICE_PORT}

spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${FOOD_DELIVERY_DATABASE}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      database: ${FOOD_DELIVERY_REDIS_DB}

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    producer:
      acks: all
      retries: 3
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: find-driver-for-food:com.trung.fooddeliveryservice.event.FindDriverForFoodOrderEvent,driver-assigned-food:com.trung.fooddeliveryservice.event.DriverAssignedToFoodOrderEvent
    consumer:
      group-id: food-delivery-service-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "*"
        spring.json.type.mapping: driver-assigned-food:com.trung.fooddeliveryservice.event.DriverAssignedToFoodOrderEvent,com.trung.bookingservice.event.DriverAssignedToFoodOrderEvent:com.trung.fooddeliveryservice.event.DriverAssignedToFoodOrderEvent


eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE}
    fetch-registry: true
    register-with-eureka: true
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET}


management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.trung: INFO

    org.springframework: WARN
    org.hibernate: WARN
    org.apache.kafka: WARN
    com.netflix.eureka: WARN

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n"

app:
  payment-service-url: ${PAYMENT_SERVICE_URL:https://api.ridehailingsystem.online}
  driver-service-url: ${DRIVER_SERVICE_URL:https://api.ridehailingsystem.online}