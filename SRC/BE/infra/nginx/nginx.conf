server {
    listen 80;
    server_name ridehailingsystem.online;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }
}

server {
    listen 80;
    server_name api.ridehailingsystem.online;

    location / {
        proxy_pass http://api-gateway:8080;

        proxy_set_header Authorization $http_authorization;
        proxy_pass_header Authorization;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location ~* /(ws-booking|ws-location)/ {
        proxy_pass http://api-gateway:8080;

        # Ép buộc Nginx giữ kết nối liên tục không ngắt quãng
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Chuyển tiếp các Header mạng
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Tăng timeout tránh việc chạy ngầm lâu lâu SockJS bị tự ngắt kết nối
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
