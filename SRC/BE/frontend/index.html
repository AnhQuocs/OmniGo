<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Cổng Đăng Nhập & Đăng Ký - Ride Hailing</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px 0;
            box-sizing: border-box;
        }

        .auth-container {
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
            width: 440px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .tabs {
            display: flex;
            margin-bottom: 20px;
            border-bottom: 2px solid #ddd;
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 10px;
            cursor: pointer;
            font-weight: bold;
            color: #777;
        }

        .tab.active {
            color: #007bff;
            border-bottom: 2px solid #007bff;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
            font-size: 14px;
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 5px;
            box-sizing: border-box;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .btn-submit:hover {
            background-color: #0056b3;
        }

        .driver-fields {
            display: none;
            background: #e9ecef;
            padding: 14px;
            border-radius: 8px;
            margin-top: 10px;
            border: 1px solid #ced4da;
        }

        .doc-section-title {
            font-weight: bold;
            font-size: 13px;
            color: #007bff;
            margin-top: 12px;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 5px;
            border-bottom: 1px dashed #b8c2cc;
            padding-bottom: 4px;
        }

        .doc-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 10px;
        }

        .doc-box {
            background: #ffffff;
            border: 1px dashed #007bff;
            border-radius: 6px;
            padding: 8px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .doc-box:hover {
            background: #f0f7ff;
            border-color: #0056b3;
        }

        .doc-box label {
            font-size: 12px;
            color: #333;
            font-weight: 600;
            cursor: pointer;
            display: block;
            margin-bottom: 4px;
        }

        .doc-box input[type="file"] {
            display: none;
        }

        .doc-preview {
            width: 100%;
            height: 80px;
            object-fit: cover;
            border-radius: 4px;
            border: 1px solid #ddd;
            display: none;
            margin-top: 5px;
        }

        .doc-placeholder {
            font-size: 11px;
            color: #6c757d;
            padding: 15px 4px;
            display: block;
        }

        .doc-status {
            font-size: 11px;
            font-weight: 500;
            margin-top: 4px;
            padding: 2px 4px;
            border-radius: 3px;
        }

        .error-msg {
            color: red;
            font-size: 13px;
            text-align: center;
            margin-top: 10px;
        }
    </style>
</head>
<body>

<div class="auth-container">
    <div class="tabs">
        <div class="tab active" onclick="switchTab('login')">ĐĂNG NHẬP</div>
        <div class="tab" onclick="switchTab('register')">ĐĂNG KÝ</div>
    </div>

    <div id="login-form">
        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" id="login-phone" placeholder="VD: 0987654321">
        </div>
        <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center;">
                <label style="margin-bottom:0;">Mật khẩu</label>
                <a href="javascript:void(0)" onclick="switchTab('forgot')" style="font-size: 12px; color: #007bff; text-decoration: none; font-weight: 600;">Quên mật khẩu?</a>
            </div>
            <input type="password" id="login-password" placeholder="Nhập mật khẩu" style="margin-top: 5px;">
        </div>

        <button class="btn-submit" onclick="doLogin()">ĐĂNG NHẬP</button>
        <div id="login-error" class="error-msg"></div>
    </div>

    <!-- QUÊN MẬT KHẨU / OTP 60S (PHASE 1) -->
    <div id="forgot-form" style="display: none;">
        <div style="text-align: center; margin-bottom: 15px;">
            <h3 style="margin: 0; color: #007bff;">🔑 Quên Mật Khẩu</h3>
            <p style="font-size: 12px; color: #666; margin: 5px 0 0;">Xác thực mã OTP 6 số qua Email (Hiệu lực nghiêm ngặt 60s)</p>
        </div>

        <!-- BƯỚC 1: GỬI OTP -->
        <div id="forgot-step-1">
            <div class="form-group">
                <label>Email tài khoản</label>
                <input type="email" id="forgot-email" placeholder="VD: user@example.com">
            </div>
            <button class="btn-submit" id="btn-send-otp" onclick="sendForgotOtp()">📧 GỬI MÃ OTP QUA EMAIL</button>
        </div>

        <!-- BƯỚC 2: NHẬP OTP -->
        <div id="forgot-step-2" style="display: none; margin-top: 15px; background: #f8fafc; padding: 12px; border-radius: 8px; border: 1px dashed #cbd5e1;">
            <div class="form-group">
                <div style="display: flex; justify-content: space-between; align-items: center;">
                    <label style="margin-bottom:0;">Mã OTP (6 chữ số)</label>
                    <span id="otp-timer-badge" style="font-size: 11px; font-weight: bold; color: #dc2626; background: #fee2e2; padding: 2px 6px; border-radius: 4px;">60s</span>
                </div>
                <input type="text" id="forgot-otp" placeholder="VD: 123456" maxlength="6" style="margin-top: 5px; font-size: 18px; letter-spacing: 4px; text-align: center; font-weight: bold;">
            </div>
            <button class="btn-submit" style="background-color: #f59e0b;" onclick="verifyForgotOtp()">✓ XÁC THỰC MÃ OTP</button>
        </div>

        <!-- BƯỚC 3: ĐẶT LẠI MẬT KHẨU MỚI -->
        <div id="forgot-step-3" style="display: none; margin-top: 15px; background: #ecfdf5; padding: 12px; border-radius: 8px; border: 1px dashed #a7f3d0;">
            <div class="form-group">
                <label>Mật khẩu mới</label>
                <input type="password" id="forgot-new-pass" placeholder="Tối thiểu 6 ký tự">
            </div>
            <div class="form-group">
                <label>Xác nhận mật khẩu mới</label>
                <input type="password" id="forgot-confirm-pass" placeholder="Nhập lại mật khẩu mới">
            </div>
            <button class="btn-submit" style="background-color: #10b981;" onclick="resetForgotPass()">💾 ĐẶT LẠI MẬT KHẨU</button>
        </div>

        <div id="forgot-msg" class="error-msg" style="margin-top: 10px;"></div>

        <div style="text-align: center; margin-top: 15px;">
            <a href="javascript:void(0)" onclick="switchTab('login')" style="font-size: 13px; color: #64748b; text-decoration: none;">← Quay lại Đăng nhập</a>
        </div>
    </div>

    <div id="register-form" style="display: none;">
        <div class="form-group">
            <label>Họ và tên</label>
            <input type="text" id="reg-name" placeholder="Nguyễn Văn A">
        </div>
        <div class="form-group">
            <label>Số điện thoại</label>
            <input type="text" id="reg-phone" placeholder="0987654321">
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="reg-email" placeholder="email@example.com">
        </div>
        <div class="form-group">
            <label>Mật khẩu</label>
            <input type="password" id="reg-password" placeholder="Tối thiểu 6 ký tự">
        </div>

        <div class="form-group">
            <label>Loại tài khoản đăng ký:</label>
            <select id="reg-account-type" onchange="toggleAccountTypeFields()">
                <option value="CUSTOMER">🚗 Khách hàng (Đặt xe & Đặt món)</option>
                <option value="DRIVER">🛵 Tài xế (Chạy xe & Giao đồ ăn)</option>
                <option value="RESTAURANT">🍲 Chủ quán ăn / Đối tác Nhà hàng</option>
            </select>
        </div>

        <div id="driver-fields" class="driver-fields">
            <div class="form-group">
                <label>Loại xe</label>
                <select id="reg-vehicle-type">
                    <option value="BIKE">OmniBike (Xe Máy 2 Bánh)</option>
                    <option value="CAR_4_SEAT">OmniCar (Ô tô 4 chỗ)</option>
                    <option value="CAR_7_SEAT">OmniCar (Ô tô 7 chỗ)</option>
                    <option value="EXPRESS">OmniExpress (Giao hàng siêu tốc)</option>
                </select>
            </div>
            <div class="form-group">
                <label>Biển số xe</label>
                <input type="text" id="reg-plate" placeholder="VD: 29A-12345">
            </div>
            <div class="form-group">
                <label>Dòng xe</label>
                <input type="text" id="reg-model" placeholder="VD: Honda Wave, Toyota Vios">
            </div>

            <!-- HỒ SƠ GIẤY TỜ PHÁP LÝ (BẮT BUỘC) -->
            <div class="doc-section-title">
                <span>🪪 1. Căn Cước Công Dân (CCCD / CMND) *</span>
            </div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 12px;">Số CCCD (Tùy chọn)</label>
                <input type="text" id="reg-cccd-number" placeholder="VD: 001201012345">
            </div>
            <div class="doc-grid">
                <div class="doc-box" onclick="document.getElementById('file-cccd-front').click()">
                    <label>Mặt trước CCCD *</label>
                    <input type="file" id="file-cccd-front" accept="image/*" onchange="handleImagePick(event, 'cccdFront')">
                    <span id="ph-cccd-front" class="doc-placeholder">📁 Bấm chọn ảnh</span>
                    <img id="prev-cccd-front" class="doc-preview" alt="CCCD Mặt trước">
                    <div id="status-cccd-front" class="doc-status" style="display: none;"></div>
                </div>
                <div class="doc-box" onclick="document.getElementById('file-cccd-back').click()">
                    <label>Mặt sau CCCD *</label>
                    <input type="file" id="file-cccd-back" accept="image/*" onchange="handleImagePick(event, 'cccdBack')">
                    <span id="ph-cccd-back" class="doc-placeholder">📁 Bấm chọn ảnh</span>
                    <img id="prev-cccd-back" class="doc-preview" alt="CCCD Mặt sau">
                    <div id="status-cccd-back" class="doc-status" style="display: none;"></div>
                </div>
            </div>

            <div class="doc-section-title">
                <span>📄 2. Giấy Phép Lái Xe (GPLX) *</span>
            </div>
            <div class="form-group" style="margin-bottom: 8px;">
                <label style="font-size: 12px;">Số GPLX (Tùy chọn)</label>
                <input type="text" id="reg-gplx-number" placeholder="VD: 790182391283">
            </div>
            <div class="doc-grid">
                <div class="doc-box" onclick="document.getElementById('file-gplx-front').click()">
                    <label>Mặt trước GPLX *</label>
                    <input type="file" id="file-gplx-front" accept="image/*" onchange="handleImagePick(event, 'gplxFront')">
                    <span id="ph-gplx-front" class="doc-placeholder">📁 Bấm chọn ảnh</span>
                    <img id="prev-gplx-front" class="doc-preview" alt="GPLX Mặt trước">
                    <div id="status-gplx-front" class="doc-status" style="display: none;"></div>
                </div>
                <div class="doc-box" onclick="document.getElementById('file-gplx-back').click()">
                    <label>Mặt sau GPLX *</label>
                    <input type="file" id="file-gplx-back" accept="image/*" onchange="handleImagePick(event, 'gplxBack')">
                    <span id="ph-gplx-back" class="doc-placeholder">📁 Bấm chọn ảnh</span>
                    <img id="prev-gplx-back" class="doc-preview" alt="GPLX Mặt sau">
                    <div id="status-gplx-back" class="doc-status" style="display: none;"></div>
                </div>
            </div>
        </div>

        <button class="btn-submit" style="background-color: #28a745;" onclick="doRegister()">ĐĂNG KÝ</button>
        <div id="reg-error" class="error-msg"></div>
    </div>
</div>

<script>
    const isLocal = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1');
    const API_BASE = isLocal ? 'http://localhost:8080/api/v1' : 'https://api.ridehailingsystem.online/api/v1';

    // Chuyển tab
    function switchTab(tab) {
        document.getElementById('login-form').style.display = tab === 'login' ? 'block' : 'none';
        document.getElementById('register-form').style.display = tab === 'register' ? 'block' : 'none';
        const forgotEl = document.getElementById('forgot-form');
        if (forgotEl) forgotEl.style.display = tab === 'forgot' ? 'block' : 'none';

        document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
        if (event && event.target && event.target.classList.contains('tab')) {
            event.target.classList.add('active');
        } else if (tab === 'login') {
            document.querySelectorAll('.tab')[0]?.classList.add('active');
        } else if (tab === 'register') {
            document.querySelectorAll('.tab')[1]?.classList.add('active');
        }

        document.getElementById('login-error').innerText = '';
        document.getElementById('reg-error').innerText = '';
        if (document.getElementById('forgot-msg')) document.getElementById('forgot-msg').innerText = '';
    }

    // ===== QUÊN MẬT KHẨU & OTP 60S LOGIC (PHASE 1) =====
    let forgotVerificationToken = null;
    let otpCountdownInterval = null;

    async function sendForgotOtp() {
        const email = document.getElementById('forgot-email').value.trim();
        const msgEl = document.getElementById('forgot-msg');
        const btnSend = document.getElementById('btn-send-otp');

        if (!email) {
            msgEl.style.color = 'red';
            return msgEl.innerText = 'Vui lòng nhập địa chỉ email tài khoản';
        }

        msgEl.style.color = '#0056b3';
        msgEl.innerText = 'Đang gửi mã OTP xác thực qua Email...';
        btnSend.disabled = true;

        try {
            let res = await fetch(`${API_BASE}/auth/otp/send`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, purpose: 'RESET_PASSWORD' })
            });
            let data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success) {
                throw new Error(data.message || data.error || 'Gửi mã OTP thất bại');
            }

            msgEl.style.color = '#15803d';
            msgEl.innerText = `✅ Đã gửi mã OTP 6 số tới ${data.data?.target || email}! Mã có hiệu lực trong 60 giây.`;

            // Mở bước 2
            document.getElementById('forgot-step-2').style.display = 'block';

            // Đếm ngược cooldown 60s
            let remaining = data.data?.expiresInSeconds || 60;
            const timerBadge = document.getElementById('otp-timer-badge');
            clearInterval(otpCountdownInterval);

            otpCountdownInterval = setInterval(() => {
                remaining--;
                if (timerBadge) timerBadge.innerText = `${remaining}s`;
                if (btnSend) btnSend.innerText = `⏳ Gửi lại sau (${remaining}s)...`;

                if (remaining <= 0) {
                    clearInterval(otpCountdownInterval);
                    btnSend.disabled = false;
                    btnSend.innerText = '📧 GỬI LẠI MÃ OTP';
                    if (timerBadge) timerBadge.innerText = 'Hết hạn';
                }
            }, 1000);

        } catch (err) {
            btnSend.disabled = false;
            msgEl.style.color = 'red';
            msgEl.innerText = err.message;
        }
    }

    async function verifyForgotOtp() {
        const email = document.getElementById('forgot-email').value.trim();
        const otp = document.getElementById('forgot-otp').value.trim();
        const msgEl = document.getElementById('forgot-msg');

        if (!otp || otp.length < 6) {
            msgEl.style.color = 'red';
            return msgEl.innerText = 'Vui lòng nhập đủ 6 chữ số mã OTP';
        }

        msgEl.style.color = '#0056b3';
        msgEl.innerText = 'Đang kiểm tra mã OTP...';

        try {
            let res = await fetch(`${API_BASE}/auth/otp/verify`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ email: email, otpCode: otp, purpose: 'RESET_PASSWORD' })
            });
            let data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success || !data.data?.verificationToken) {
                throw new Error(data.message || data.error || 'Mã OTP không chính xác hoặc đã hết hạn');
            }

            forgotVerificationToken = data.data.verificationToken;
            msgEl.style.color = '#15803d';
            msgEl.innerText = '✅ Xác thực OTP thành công! Vui lòng nhập mật khẩu mới.';

            // Mở bước 3
            document.getElementById('forgot-step-3').style.display = 'block';
            clearInterval(otpCountdownInterval);
        } catch (err) {
            msgEl.style.color = 'red';
            msgEl.innerText = err.message;
        }
    }

    async function resetForgotPass() {
        const email = document.getElementById('forgot-email').value.trim();
        const newPass = document.getElementById('forgot-new-pass').value;
        const confirmPass = document.getElementById('forgot-confirm-pass').value;
        const msgEl = document.getElementById('forgot-msg');

        if (!newPass || newPass.length < 6) {
            msgEl.style.color = 'red';
            return msgEl.innerText = 'Mật khẩu mới phải có ít nhất 6 ký tự';
        }
        if (newPass !== confirmPass) {
            msgEl.style.color = 'red';
            return msgEl.innerText = 'Mật khẩu xác nhận không khớp!';
        }
        if (!forgotVerificationToken) {
            msgEl.style.color = 'red';
            return msgEl.innerText = 'Thiếu mã xác thực OTP. Vui lòng thử lại từ đầu.';
        }

        msgEl.style.color = '#0056b3';
        msgEl.innerText = 'Đang cập nhật mật khẩu mới...';

        try {
            let res = await fetch(`${API_BASE}/auth/reset-password`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    email: email,
                    verificationToken: forgotVerificationToken,
                    newPassword: newPass,
                    confirmPassword: confirmPass
                })
            });
            let data = await res.json().catch(() => ({}));

            if (!res.ok || !data.success) {
                throw new Error(data.message || data.error || 'Đặt lại mật khẩu thất bại');
            }

            alert('🎉 Đặt lại mật khẩu thành công!\nVui lòng đăng nhập lại bằng mật khẩu mới của bạn.');
            switchTab('login');
        } catch (err) {
            msgEl.style.color = 'red';
            msgEl.innerText = err.message;
        }
    }

    // Ẩn/hiện Form nhập xe tài xế
    function toggleAccountTypeFields() {
        const accType = document.getElementById('reg-account-type').value;
        document.getElementById('driver-fields').style.display = (accType === 'DRIVER') ? 'block' : 'none';
    }

    // Xử lý Login theo đúng Role từ Backend
    async function doLogin(phoneOverride, passOverride, intendedRole) {
        const phone = phoneOverride || document.getElementById('login-phone').value;
        const password = passOverride || document.getElementById('login-password').value;
        const errorEl = document.getElementById('login-error');

        if (!phone || !password) return errorEl.innerText = "Vui lòng nhập đủ SĐT và Mật khẩu";
        errorEl.innerText = "Đang đăng nhập và kiểm tra quyền...";

        try {
            let res = await fetch(`${API_BASE}/auth/login`, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                credentials: 'include',
                body: JSON.stringify({phoneNumber: phone, password: password})
            });

            let resText = await res.text();
            let data;
            try {
                data = JSON.parse(resText);
            } catch (e) {
                throw new Error(resText || "Lỗi máy chủ (" + res.status + ")");
            }

            if (!res.ok || !data.success) {
                const errorMsg = data.message || data.error || "Đăng nhập thất bại";
                throw new Error(errorMsg);
            }

            // Lưu Token & Thông tin User
            const token = data.data.accessToken;
            const role = data.data.user.role;
            localStorage.setItem('accessToken', token);
            if (data.data.user) {
                localStorage.setItem('user', JSON.stringify(data.data.user));
            }

            // Điều hướng tự động chính xác 100% theo Role của User
            if (role === 'DRIVER' || role === 'ROLE_DRIVER') {
                window.location.href = 'driver-app.html';
                return;
            }

            if (role === 'RESTAURANT' || role === 'ROLE_RESTAURANT' || intendedRole === 'RESTAURANT') {
                window.location.href = 'restaurant-app.html';
                return;
            }

            // Với tài khoản CUSTOMER: Kiểm tra xem user này đã sở hữu nhà hàng chưa
            try {
                let checkRes = await fetch(`${API_BASE}/restaurants/my-restaurant`, {
                    headers: {'Authorization': 'Bearer ' + token}
                });
                let checkData = await checkRes.json();
                if (checkRes.ok && checkData.success && checkData.data) {
                    // Đã có nhà hàng -> chuyển thẳng vào cổng nhà hàng
                    window.location.href = 'restaurant-app.html';
                    return;
                }
            } catch (errCheck) {
                // Nếu chưa có nhà hàng hoặc lỗi -> đưa vào khách hàng
            }

            // Mặc định vào app Khách hàng
            window.location.href = 'customer-app.html';

        } catch (err) {
            errorEl.innerText = err.message;
        }
    }

    // Lưu trữ File và Cloudinary URL của ảnh giấy tờ
    const driverDocFiles = {
        cccdFront: null,
        cccdBack: null,
        gplxFront: null,
        gplxBack: null
    };

    const driverDocs = {
        cccdFront: '',
        cccdBack: '',
        gplxFront: '',
        gplxBack: ''
    };

    const keyMap = {
        'cccdFront': { ph: 'ph-cccd-front', prev: 'prev-cccd-front', status: 'status-cccd-front', label: 'CCCD mặt trước' },
        'cccdBack': { ph: 'ph-cccd-back', prev: 'prev-cccd-back', status: 'status-cccd-back', label: 'CCCD mặt sau' },
        'gplxFront': { ph: 'ph-gplx-front', prev: 'prev-gplx-front', status: 'status-gplx-front', label: 'GPLX mặt trước' },
        'gplxBack': { ph: 'ph-gplx-back', prev: 'prev-gplx-back', status: 'status-gplx-back', label: 'GPLX mặt sau' }
    };

    async function uploadDriverDocFile(file) {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch(`${API_BASE}/drivers/upload-document`, {
            method: 'POST',
            body: formData
        });
        const resText = await res.text();
        let data;
        try {
            data = JSON.parse(resText);
        } catch (e) {
            throw new Error(`Lỗi máy chủ (${res.status})`);
        }
        if (!res.ok || !data.success || !data.data || !data.data.url) {
            throw new Error(data.message || data.error || 'Tải ảnh lên Cloudinary thất bại');
        }
        return data.data.url;
    }

    async function handleImagePick(event, docType) {
        const file = event.target.files[0];
        if (!file) return;

        if (!file.type.startsWith('image/')) {
            alert('Vui lòng chọn tệp hình ảnh hợp lệ (PNG, JPG, JPEG, WEBP)!');
            event.target.value = '';
            return;
        }

        driverDocFiles[docType] = file;
        driverDocs[docType] = '';

        const map = keyMap[docType];
        if (map) {
            document.getElementById(map.ph).style.display = 'none';
            const img = document.getElementById(map.prev);
            const statusEl = document.getElementById(map.status);

            const reader = new FileReader();
            reader.onload = function(e) {
                img.src = e.target.result;
                img.style.display = 'block';
            };
            reader.readAsDataURL(file);

            if (statusEl) {
                statusEl.style.display = 'block';
                statusEl.style.color = '#0056b3';
                statusEl.innerText = '⏳ Đang tải ảnh lên Cloudinary...';
            }

            try {
                const url = await uploadDriverDocFile(file);
                driverDocs[docType] = url;
                if (statusEl) {
                    statusEl.style.color = '#28a745';
                    statusEl.innerText = '✓ Đã tải lên Cloudinary';
                }
            } catch (err) {
                console.warn('Lỗi tải ảnh ngay khi chọn:', err);
                if (statusEl) {
                    statusEl.style.color = '#e67e22';
                    statusEl.innerText = '⚠️ Sẽ tải lại khi bấm Đăng ký';
                }
            }
        }
    }

    // Xử lý Register
    async function doRegister() {
        const name = document.getElementById('reg-name').value;
        const phone = document.getElementById('reg-phone').value;
        const email = document.getElementById('reg-email').value;
        const password = document.getElementById('reg-password').value;
        const accType = document.getElementById('reg-account-type').value;
        const errorEl = document.getElementById('reg-error');

        if (!name || !phone || !email || !password) return errorEl.innerText = "Vui lòng điền đủ thông tin cơ bản";

        let payload = {
            fullName: name, 
            phoneNumber: phone, 
            email: email, 
            password: password,
            fcmToken: 'fcm_web_demo_' + Date.now()
        };
        let url = `${API_BASE}/users/register/customer`;

        if (accType === 'DRIVER') {
            url = `${API_BASE}/drivers/register`;
            payload.vehicleType = document.getElementById('reg-vehicle-type').value;
            payload.licensePlate = (document.getElementById('reg-plate').value || '').trim().toUpperCase();
            payload.vehicleModel = (document.getElementById('reg-model').value || '').trim();
            if (!payload.licensePlate || !payload.vehicleModel) return errorEl.innerText = "Vui lòng nhập đủ thông tin xe";

            payload.cccdNumber = document.getElementById('reg-cccd-number').value.trim() || undefined;
            payload.gplxNumber = document.getElementById('reg-gplx-number').value.trim() || undefined;

            if (!driverDocFiles.cccdFront || !driverDocFiles.cccdBack) {
                errorEl.style.color = "red";
                return errorEl.innerText = "Vui lòng tải lên đầy đủ ảnh chụp 2 mặt Căn cước công dân (CCCD)!";
            }
            if (!driverDocFiles.gplxFront || !driverDocFiles.gplxBack) {
                errorEl.style.color = "red";
                return errorEl.innerText = "Vui lòng tải lên đầy đủ ảnh chụp 2 mặt Giấy phép lái xe (GPLX)!";
            }

            errorEl.style.color = "blue";
            errorEl.innerText = "Đang tải ảnh giấy tờ lên hệ thống Cloudinary...";

            const docKeys = ['cccdFront', 'cccdBack', 'gplxFront', 'gplxBack'];
            for (const key of docKeys) {
                if (!driverDocs[key]) {
                    const map = keyMap[key];
                    const statusEl = document.getElementById(map.status);
                    if (statusEl) {
                        statusEl.style.display = 'block';
                        statusEl.style.color = '#0056b3';
                        statusEl.innerText = '⏳ Đang tải ảnh lên Cloudinary...';
                    }
                    try {
                        driverDocs[key] = await uploadDriverDocFile(driverDocFiles[key]);
                        if (statusEl) {
                            statusEl.style.color = '#28a745';
                            statusEl.innerText = '✓ Đã tải lên Cloudinary';
                        }
                    } catch (uploadErr) {
                        if (statusEl) {
                            statusEl.style.color = 'red';
                            statusEl.innerText = '⚠️ Tải ảnh thất bại!';
                        }
                        errorEl.style.color = "red";
                        return errorEl.innerText = `Lỗi tải ảnh ${map.label}: ${uploadErr.message}`;
                    }
                }
            }

            payload.cccdFrontImage = driverDocs.cccdFront;
            payload.cccdBackImage = driverDocs.cccdBack;
            payload.gplxFrontImage = driverDocs.gplxFront;
            payload.gplxBackImage = driverDocs.gplxBack;

            if (!payload.cccdFrontImage || !payload.cccdBackImage) {
                errorEl.style.color = "red";
                return errorEl.innerText = "Vui lòng tải lên đầy đủ ảnh chụp 2 mặt Căn cước công dân (CCCD)!";
            }
            if (!payload.gplxFrontImage || !payload.gplxBackImage) {
                errorEl.style.color = "red";
                return errorEl.innerText = "Vui lòng tải lên đầy đủ ảnh chụp 2 mặt Giấy phép lái xe (GPLX)!";
            }
        }

        errorEl.innerText = "Đang xử lý đăng ký...";
        errorEl.style.color = "blue";

        try {
            let res = await fetch(url, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            });
            let data = await res.json();

            if (!res.ok || !data.success) throw new Error(data.message || data.error || "Đăng ký thất bại");

            errorEl.style.color = "green";
            errorEl.innerText = "Đăng ký thành công! Hồ sơ đang chờ Quản trị viên phê duyệt. Đang chuyển hướng...";

            // Tự động Login sau khi đăng ký và chuyển đúng trang tương ứng
            setTimeout(() => doLogin(phone, password, accType), 1200);
        } catch (err) {
            errorEl.style.color = "red";
            errorEl.innerText = err.message;
        }
    }
</script>
